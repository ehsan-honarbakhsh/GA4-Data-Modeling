<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"
     role="img" aria-label="GA4 Data Modeling">
  <title>GA4 Data Modeling</title>
  <defs>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0"   stop-color="#F97316"/>
      <stop offset="1"   stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <rect width="96" height="96" rx="20" fill="#0F172A"/>

  <!-- The total: one line, sitting above the breakdown, deliberately not their sum. -->
  <line x1="21" y1="25" x2="75" y2="25" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="75" cy="25" r="4" fill="#38BDF8"/>

  <!-- The breakdown: exact row by row, wrong when added up. -->
  <rect x="24"   y="52" width="13" height="24" rx="3" fill="url(#bar)"/>
  <rect x="41.5" y="43" width="13" height="33" rx="3" fill="url(#bar)"/>
  <rect x="59"   y="36" width="13" height="40" rx="3" fill="url(#bar)"/>
</svg>
